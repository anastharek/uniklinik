#version: "2"
#if needed to map the orthancPACS to a different hard disk device (after mounting it in path)
# volumes: ["/home/petctviewer/orthanc:/var/lib/orthanc/db:Z"]

services:

    padipacs:
        image: pdml/padimedicalstroke5:3  #6 latest code #5 #7 change header and add logo sehat hospital #5 latest version before 28/10 #9 inventory update #8 Stable pm5.1 #7 sendto #padimedicaldemo5.0:5 #4 ASSIGN DOCKTOR request features #padimedicalgleneagle4.2:7 #padimedicaldemo5.0:1 #2 add new (okay but ad bugs) #1 issue create study(date,time incorrect)
        build:
          context: .
        container_name: pmstroke5.1 #tukar
        ports: ["9156:4000"] #tukar
        restart: unless-stopped
        volumes: ["./orthanc3:/var/lib/orthanc/db:Z", "./BackEnd/database/migrations:/OrthancToolsJs/database/migrations:Z", "./BackEnd/services:/OrthancToolsJs/services:Z", "./BackEnd/cron:/OrthancToolsJs/cron:Z"]
        environment:
            TZ: "Asia/Kuala_Lumpur"
            ORTHANC_ADDRESS: "http://orthanc"
            ORTHANC_PORT: "8042"
            ORTHANC_USERNAME: "REDACTED"
            ORTHANC_PASSWORD: "REDACTED"
            DOMAIN_PROTOCOL: "https"
            DOMAIN_ADDRESS: "stroke.padimedical.com" #tukar
            REDIS_HOST: "redis"
            REDIS_PORT: "6379"
            REDIS_PASSWORD: ""
            NODE_ENV: "production"
            TOKEN_SECRET: "${TOKEN_SECRET}"
            DB_HOST: "postgres"
            DB_PORT: 5432
            DB_NAME: "padimedical"
            DB_USERNAME: "postgres"
            DB_PASSWORD: ""

    redis:
        image: redis:alpine
        container_name: redis-stroke5.1 #tukar
        restart: unless-stopped

    postgres:
        container_name: postgres-stroke5.1 #tukar
        image: postgres:13.1
        ports: ["5490:5432"] #tukar
        environment:
            TZ: "Asia/Kuala_Lumpur"
            POSTGRES_DB: "padimedical"
            POSTGRES_HOST_AUTH_METHOD: "trust"
            PG_STORAGE_ENABLED: "true"
            PG_INDEX_ENABLED: "true"
        volumes:
            - /home/svr04pm01/Desktop/POSTGRES FOLDER/PACS RESEARCH/PUTRACNS/POSTGRES:/var/lib/postgresql/data
        restart: unless-stopped

    orthanc:
        build: orthanc-pacs
        #image: orthancteam/orthanc:25.12.3-full #osimis/orthanc:23.3.4 #23.3.4
        container_name: orthanc-pmstroke5.1 #tukar
        depends_on: [postgres]
        ports: ["8475:8042", "4371:4242"] #tukar
        restart: unless-stopped
        mem_limit: 12g
        volumes: ["./ORTHANC:/var/lib/orthanc/db:Z"]
        environment:
            TZ: "Asia/Kuala_Lumpur"
            ORTHANC__NAME: "STROKE" #exchange
            VERBOSE_STARTUP: "false"
            TRACE_ENABLED: "false"

            ORTHANC__DICOM_SERVER_ENABLED: "true"
            ORTHANC__LUA_SCRIPTS: '["/etc/orthanc/scripts/modify.lua"]'
            ORTHANC__OVERWRITE_INSTANCES: "true"
            
            ORTHANC__DICOM_MODALITIES_IN_DATABASE: "false"
            ORTHANC__DICOM_MODALITIES: |
              {
                "RADIOSERVER": ["RADIOSERVER", "10.150.244.86", 104]
              }
            ORTHANC__ORTHANC_PEERS_IN_DATABASE: "true"

            DICOM_WEB_PLUGIN_ENABLED: "true"
            OSIMIS_WEB_VIEWER1_PLUGIN_ENABLED: "true"
            PYTHON_PLUGIN_ENABLED: "false"
            TRANSFERS_PLUGIN_ENABLED: "true"
            WORKLISTS_PLUGIN_ENABLED: "false"

            AUTHORIZATION_PLUGIN_ENABLE: "false"
            ORTHANC__AUTHENTICATION_ENABLE: "false"
            ORTHANC__AUTHENTICATION_ENABLED: "false"

            ORTHANC__REGISTERED_USERS: |
                {"REDACTED": "REDACTED"}

            ORTHANC__DICOM_WEB__ENABLE: "true"
            ORTHANC__DICOM_WEB__ROOT: "/dicom-web/"
            ORTHANC__DICOM_WEB__ENABLEWADO: "true"
            ORTHANC__DICOM_WEB__WADOROOT: "/wado"
            ORTHANC__DICOM_WEB__SSL: "true"
            ORTHANC__DICOM_WEB__STUDIESMETADATA: "MainDicomTags"
            ORTHANC__DICOM_WEB__SERIESMETADATA: "MainDicomTags"

            ORTHANC__DICOM__AET: "STROKE" #exchange

            ORTHANC__POSTGRESQL__HOST: "postgres"
            ORTHANC__POSTGRESQL__INDEX_CONNECTIONS_COUNT: "20"
            ORTHANC__POSTGRESQL__MAXIMUM_CONNECTION_RETRIES: "10"
            ORTHANC__POSTGRESQL__LOCK: "false"

            

            #General setting
            ORTHANC__DICOM_ALWAYS_ALLOW_STORE: "false"
            ORTHANC__LIMIT_FIND_RESULTS: "200" #exchange
            ORTHANC__LIMIT_FIND_INSTANCES: "100"
            ORTHANC__STABLE_AGE: "300"
            ORTHANC__HTTPS_VERIFY_PEERS: "true"
            ORTHANC__ORTHANC_EXPLORER_ENABLED: "true"
            ORTHANC__MAXIMUM_STORAGE_SIZE: "2000000" #Change storage size (was 100GB — caused data loss during RADIOSERVER flood)
            ORTHANC__MAXIMUM_STORAGE_CACHE_SIZE: "4096" #RAM cache for recently read/written files (default 128MB → 4GB so preloaded frames stay hot)
            # Osimis viewer plugin cache (modern ORTHANC__WEB_VIEWER__* form for orthancteam image; legacy MVB_/WVB_ env vars are deprecated and refuse startup)
            ORTHANC__WEB_VIEWER__SHORT_TERM_CACHE_ENABLED: "true"
            ORTHANC__WEB_VIEWER__SHORT_TERM_CACHE_SIZE: "5000" #MB, same as tuned reference (5GB short-term cache)
            ORTHANC__WEB_VIEWER__SHORT_TERM_CACHE_PREFETCH_ON_INSTANCE_STORED: "true"
            ORTHANC__WEB_VIEWER__INSTANCE_INFO_CACHE_ENABLED: "true"
            ORTHANC__WEB_VIEWER__HIGH_QUALITY_IMAGE_PRELOADING_ENABLED: "true"
            ORTHANC__KEEP_ALIVE: "true"
            ORTHANC__TCP_NO_DELAY: "true"
            ORTHANC__STORAGE_ACCESS_ON_FIND: "Never"
            ORTHANC__SAVE_JOBS: "false"

            ORTHANC__DICOM_SCU_TIMEOUT: "300"
            ORTHANC__DICOM_SCP_TIMEOUT: "300"
            ORTHANC__DICOM_QUERY_RETRIEVE_SIZE: 0

            ORTHANC__HTTP_REQUEST_TIMEOUT: "30" ##default:60
            ORTHANC__HTTP_TIMEOUT: "30"         ##60
            ORTHANC__HTTP_CL_TIMEOUT: "120"      ##100

            #setting to speed up
            ORTHANC__HTTP_THREADS_COUNT: "32"
            ORTHANC__CONCURRENT_JOBS: "2"
            ORTHANC__TRANSFERS_RETRIES: "5"
            ORTHANC__TRANSFERS_ENABLED: "true"
            ORTHANC__DICOM_THREADS_COUNT: 4
            ORTHANC__DICOM_UNKNOWN_SOP_CLASS_ACCEPTED: "true"
            ORTHANC__SYNCHRONOUS_ZIP_STREAM: "true"
            ORTHANC__MEDIA_ARCHIVE_SIZE: "100"
            ORTHANC__MAXIMUM_STORAGE_MODE: "Recycle"
            #transcoding
            ORTHANC__HOUSEKEEPER_PLUGIN_ENABLED: "false"
            # DISABLED — JPEG2000 codec not available in DCMTK
            # ORTHANC__INGEST_TRANSCODING: "1.2.840.10008.1.2.4.90"
            ORTHANC__INGEST_TRANSCODING_OF_COMPRESSED: "false"
            ORTHANC__OverwritesInstances: "true"
            #GDCM
            ORTHANC__GDCM__THROTTLING: "4"
            ORTHANC__GDCM__RESTRICT_TRANSFER_SYNTAXES: |
              ["1.2.840.10008.5.1.4.1.1.77.1.6"]

            ORTHANC__EXTRA_MAIN_DICOM_TAGS: |
              {
                "Instance" : [
                    "Rows",
                    "Columns",
                    "ImageType",
                    "SOPClassUID",
                    "ContentDate",
                    "ContentTime",
                    "FrameOfReferenceUID",
                    "PixelSpacing",
                    "SpecificCharacterSet",
                    "BitsAllocated",
                    "BitsStored",
                    "RescaleSlope",
                    "RescaleIntercept",
                    "SliceThickness",
                    "WindowCenter",
                    "WindowWidth",
                    "PhotometricInterpretation",
                    "PixelRepresentation"
                ],
                "Series" : [
                    "TimezoneOffsetFromUTC",
                    "PerformedProcedureStepStartDate",
                    "PerformedProcedureStepStartTime",
                    "RequestAttributesSequence"
                ],
                "Study": [
                    "TimezoneOffsetFromUTC"
                ],
                "Patient": []
              }





volumes:
    padipacs:
    orthanc:
    postgres:

