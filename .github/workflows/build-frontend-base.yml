name: Build Frontend Base Image

# =============================================================================
# Builds the HEAVY frontend base image (React + OHIF + Stone) in the cloud,
# then pushes it to Docker Hub. The Mac mini then only PULLS this image and
# runs a fast, light thin build — it never runs webpack/Terser again.
#
# Runs automatically when frontend sources change, or manually on demand.
# =============================================================================

on:
  # Manual trigger (recommended first run) — lets you pick the version tag
  workflow_dispatch:
    inputs:
      version:
        description: 'Base image version tag (e.g. v9)'
        required: true
        default: 'v9'

  # Auto-build when frontend sources change on main
  push:
    branches: [main]
    paths:
      - 'FrontEnd/**'
      - 'ohif/Viewers/**'
      - 'stone/**'
      - 'Dockerfile.frontend-base'
      - '.github/workflows/build-frontend-base.yml'

env:
  IMAGE_NAME: anastharek/pcns-frontend-base
  # Target platform. The Mac mini is arm64 (Apple Silicon), and the PACS
  # runtime images are built natively as arm64 — so the pre-built base MUST
  # also be arm64, otherwise `docker pull` fails on the Mac mini.
  PLATFORM: linux/arm64

jobs:
  build-and-push:
    # arm64 GitHub-hosted runner — builds arm64 natively (no emulation).
    # NOTE: if this label is unavailable on the account/plan, switch to
    # `ubuntu-latest` and set PLATFORM to linux/amd64 above (slower, emulated
    # on the Mac mini but functional).
    runs-on: ubuntu-24.04-arm
    # Generous timeout — OHIF build is heavy
    timeout-minutes: 60

    steps:
      # Ubuntu runners have ~14 GB RAM free — enough for Terser
      - name: Free up disk space
        run: |
          echo "=== Disk before ==="
          df -h /
          # Remove pre-installed toolchains we don't need
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc \
                      /opt/hostedtoolcache/CodeQL || true
          sudo docker image prune -af || true
          echo "=== Disk after ==="
          df -h /

      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      # Version tag: from manual input, or short SHA for auto builds
      - name: Compute version
        id: ver
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            V="${{ github.event.inputs.version }}"
          else
            V="$(echo ${{ github.sha }} | cut -c1-7)"
          fi
          echo "version=$V" >> "$GITHUB_OUTPUT"
          echo "Building version: $V"

      - name: Build and push frontend base image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./Dockerfile.frontend-base
          push: true
          platforms: ${{ env.PLATFORM }}
          tags: |
            ${{ env.IMAGE_NAME }}:${{ steps.ver.outputs.version }}
            ${{ env.IMAGE_NAME }}:latest
          # BuildKit cache speeds up repeat builds massively
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Summary
        run: |
          echo "## ✅ Frontend base built" >> "$GITHUB_STEP_SUMMARY"
          echo "" >> "$GITHUB_STEP_SUMMARY"
          echo "**Image:** \`${{ env.IMAGE_NAME }}:${{ steps.ver.outputs.version }}\`" >> "$GITHUB_STEP_SUMMARY"
          echo "" >> "$GITHUB_STEP_SUMMARY"
          echo "On the Mac mini, run:" >> "$GITHUB_STEP_SUMMARY"
          echo '```bash' >> "$GITHUB_STEP_SUMMARY"
          echo "./scripts/build-thin.sh ${{ steps.ver.outputs.version }} fastpacs" >> "$GITHUB_STEP_SUMMARY"
          echo '```' >> "$GITHUB_STEP_SUMMARY"
